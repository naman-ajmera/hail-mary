services:
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8085
      EVENT_SERVICE_URL: http://event-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      SEARCH_SERVICE_URL: http://search-service:8084
    depends_on:
      - auth-service
      - booking-service
      - search-service
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    ports: ["8085:8085"]
    environment:
      SERVER_PORT: 8085
    restart: unless-stopped

  event-service:
    build: ./services/event-service
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
    restart: unless-stopped

  booking-service:
    build: ./services/booking-service
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
    restart: unless-stopped

  search-service:
    build: ./services/search-service
    ports: ["8084:8084"]
    environment:
      SERVER_PORT: 8084
    restart: unless-stopped
