server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: event-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${DB_USERNAME:ticketapp}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false # Enable when the first migration and local DB setup are ready.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Event Service
    description: Event catalogue API
